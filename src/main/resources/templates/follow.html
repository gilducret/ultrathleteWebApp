<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Live Tracking | Ultrathlete</title>
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

<main layout:fragment="content">

    <!-- ═══════════════════════════════════════════
         HEADER BAR
    ════════════════════════════════════════════════ -->
    <section style="background:#1a1a2e; padding:20px 0;">
        <div class="container">
            <div style="display:flex; justify-content:space-between;
                        align-items:center; flex-wrap:wrap; gap:12px;">
                <div>
                    <h3 id="raceTitle"
                        style="color:#fff; margin:0; font-size:22px;">
                        Loading...
                    </h3>
                    <p style="color:#6677aa; margin:4px 0 0 0;
                               font-size:13px;">
                        Live tracking
                    </p>
                </div>
                <div style="text-align:right;">
                    <div id="lastUpdate"
                         style="color:#6677aa; font-size:13px;">
                        Waiting for position...
                    </div>
                    <div id="raceStatus"
                         style="font-size:13px; margin-top:4px;">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ═══════════════════════════════════════════
         RUNNER STATS BAR
         Shown once race has started
    ════════════════════════════════════════════════ -->
    <div id="statsBar"
         style="display:none; background:#121F38; color:#fff;
                padding:12px 0;">
        <div class="container">
            <div class="row text-center">
                <div class="col-4">
                    <div id="statDistance"
                         style="font-size:20px; font-weight:700;
                                color:#5fb458;">—</div>
                    <div style="font-size:11px; color:#6677aa;
                                text-transform:uppercase; letter-spacing:0.5px;">
                        Distance
                    </div>
                </div>
                <div class="col-4">
                    <div id="statElapsed"
                         style="font-size:20px; font-weight:700;
                                color:#fff;">—</div>
                    <div style="font-size:11px; color:#6677aa;
                                text-transform:uppercase; letter-spacing:0.5px;">
                        Elapsed
                    </div>
                </div>
                <div class="col-4">
                    <div id="statNext"
                         style="font-size:16px; font-weight:700;
                                color:#f39c12; white-space:nowrap;
                                overflow:hidden; text-overflow:ellipsis;">—</div>
                    <div style="font-size:11px; color:#6677aa;
                                text-transform:uppercase; letter-spacing:0.5px;">
                        Next checkpoint
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════
         ELEVATION PROFILE
    ════════════════════════════════════════════════ -->
    <div style="background:#fff; padding:16px 24px;
                border-bottom:2px solid #eee;">
        <div style="display:flex; justify-content:space-between;
                    align-items:center; margin-bottom:10px;">
            <h6 style="margin:0; color:#121F38; font-weight:700;">
                Elevation Profile
            </h6>
            <div style="font-size:11px; color:#888; display:flex; gap:16px;">
                <span style="color:#5fb458;">━ Route</span>
                <span style="color:#e74c3c;">▶ Runner</span>
                <span style="color:#5fb458; opacity:0.6;">| Checkpoint</span>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <svg id="elevationChart" width="900" height="160"
                 style="min-width:500px; display:block;">
                <text x="450" y="85" text-anchor="middle"
                      fill="#ccc" font-size="13">
                    Loading elevation profile...
                </text>
            </svg>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════
         MAP + CHECKPOINT LIST
    ════════════════════════════════════════════════ -->
    <div style="display:flex; flex-wrap:wrap;">

        <!-- Leaflet map -->
        <div style="flex:2; min-width:300px; position:relative;">
            <div id="map" style="width:100%; height:450px;"></div>

            <!-- Not started overlay -->
            <div id="notStartedOverlay"
                 style="display:none; position:absolute; top:0; left:0;
                        right:0; bottom:0; background:rgba(0,0,0,0.5);
                        z-index:1000; align-items:center;
                        justify-content:center;">
                <div style="background:#fff; padding:24px 32px;
                            border-radius:8px; text-align:center;">
                    <div style="font-size:32px; margin-bottom:8px;">⏳</div>
                    <strong>Race not started yet</strong>
                    <p style="color:#888; margin:8px 0 0 0; font-size:13px;">
                        This page will update automatically
                        when the runner starts.
                    </p>
                </div>
            </div>
        </div>

        <!-- Checkpoint list -->
        <div style="flex:1; min-width:260px; background:#fff;
                    border-left:1px solid #eee;
                    overflow-y:auto; max-height:450px;">
            <div style="padding:12px 16px; border-bottom:1px solid #eee;
                        background:#f8f9fa; position:sticky; top:0;
                        z-index:10;">
                <h6 style="margin:0; color:#121F38; font-size:14px;">
                    Checkpoints
                </h6>
                <p style="margin:2px 0 0 0; font-size:11px; color:#888;">
                    Auto-refreshes every 30s
                </p>
            </div>
            <div id="checkpointList">
                <div style="padding:24px; text-align:center; color:#aaa;">
                    Loading...
                </div>
            </div>
        </div>

    </div>

    <!-- ═══════════════════════════════════════════
         SHARE LINK
    ════════════════════════════════════════════════ -->
    <div style="background:#f8f9fa; padding:12px 0;
                border-top:1px solid #eee;">
        <div class="container">
            <div style="display:flex; align-items:center;
                        gap:12px; flex-wrap:wrap;">
                <span style="font-size:13px; color:#888;">
                    📤 Share this page:
                </span>
                <code id="shareUrl"
                      style="font-size:12px; background:#fff;
                             padding:4px 10px; border-radius:4px;
                             border:1px solid #ddd; color:#121F38;">
                </code>
                <button onclick="copyShareLink()"
                        class="button button-sm"
                        style="border:1px solid #5fb458; color:#5fb458;
                               background:transparent; padding:4px 12px;">
                    Copy link
                </button>
            </div>
        </div>
    </div>

</main>

<!-- ═══════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════════ -->
<th:block layout:fragment="extra-js">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:inline="javascript">
        (function () {

            const sessionId      = /*[[${sessionId}]]*/ 0;
            const POLL_MS        = 30_000;

            // ── State ─────────────────────────────────────────────────────
            let elevationData      = [];
            let totalDistanceM     = 0;
            let sessionCheckpoints = [];
            let runnerDistanceM    = 0;

            // ── Map setup ─────────────────────────────────────────────────
            const map = L.map('map', { zoomControl: true });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18,
            }).addTo(map);

            let routePolyline = null;
            let runnerMarker  = null;

            const runnerIcon = L.divIcon({
                className: '',
                html: `<div style="width:18px; height:18px; border-radius:50%;
                            background:#e74c3c; border:3px solid #fff;
                            box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>`,
                iconSize:   [18, 18],
                iconAnchor: [9, 9],
            });

            // ── Set share URL ─────────────────────────────────────────────
            document.getElementById('shareUrl').textContent = window.location.href;

            window.copyShareLink = function () {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => alert('Link copied to clipboard!'))
                    .catch(() => alert(window.location.href));
            };

            // ── Load session (route + elevation + checkpoints) ────────────
            async function loadSession() {
                try {
                    const response = await fetch(
                        '/follow/api/' + sessionId + '/session');

                    if (!response.ok) {
                        document.getElementById('raceTitle').textContent =
                            'Session not found';
                        return;
                    }

                    const info = await response.json();

                    // Title
                    document.getElementById('raceTitle').textContent =
                        info.raceName || 'Live Tracking';

                    // Elevation profile
                    if (info.elevationProfile && info.elevationProfile.length > 0) {
                        elevationData  = info.elevationProfile;
                        totalDistanceM = info.totalDistanceM || 0;
                        sessionCheckpoints = info.checkpoints || [];
                        renderElevationChart(0);
                    }

                    // Draw route on map
                    if (info.routePoints && info.routePoints.length > 0) {
                        routePolyline = L.polyline(info.routePoints, {
                            color:   '#5fb458',
                            weight:  3,
                            opacity: 0.8,
                        }).addTo(map);
                        map.fitBounds(routePolyline.getBounds(),
                            { padding: [30, 30] });

                        // Start marker
                        const start = info.routePoints[0];
                        L.marker(start, {
                            icon: L.divIcon({
                                className: '',
                                html: `<div style="background:#2ecc71; color:#fff;
                                           padding:2px 8px; border-radius:4px;
                                           font-size:11px; font-weight:700;">
                                   START
                               </div>`,
                                iconAnchor: [22, 10],
                            })
                        }).addTo(map);

                        // Finish marker
                        const finish =
                            info.routePoints[info.routePoints.length - 1];
                        L.marker(finish, {
                            icon: L.divIcon({
                                className: '',
                                html: `<div style="background:#e74c3c; color:#fff;
                                           padding:2px 8px; border-radius:4px;
                                           font-size:11px; font-weight:700;">
                                   FINISH
                               </div>`,
                                iconAnchor: [26, 10],
                            })
                        }).addTo(map);
                    }

                    // Initial checkpoint list (no ETAs yet)
                    renderCheckpointList(info.checkpoints || [], null);

                    // Start polling
                    pollPosition();
                    setInterval(pollPosition, POLL_MS);

                } catch (e) {
                    document.getElementById('raceTitle').textContent =
                        'Could not load session';
                    console.error(e);
                }
            }

            // ── Poll for live position + ETAs ─────────────────────────────
            async function pollPosition() {
                try {
                    const response = await fetch(
                        '/follow/api/' + sessionId + '/position');
                    if (!response.ok) return;

                    const update = await response.json();

                    if (!update.raceStarted) {
                        document.getElementById('notStartedOverlay').style.display
                            = 'flex';
                        document.getElementById('raceStatus').innerHTML =
                            '<span style="color:#f39c12;">⏳ Not started</span>';
                        return;
                    }

                    // Hide not-started overlay
                    document.getElementById('notStartedOverlay').style.display
                        = 'none';

                    // Last update time
                    const ago = update.lastUpdate
                        ? timeSince(new Date(update.lastUpdate)) : '?';
                    document.getElementById('lastUpdate').textContent =
                        'Last update: ' + ago;
                    document.getElementById('raceStatus').innerHTML =
                        '<span style="color:#5fb458;">● Live</span>';

                    // Stats bar
                    runnerDistanceM = update.distanceFromStartM || 0;
                    document.getElementById('statsBar').style.display = 'block';
                    document.getElementById('statDistance').textContent =
                        (runnerDistanceM / 1000).toFixed(1) + ' km';
                    document.getElementById('statElapsed').textContent =
                        formatDuration(update.elapsedSeconds || 0);

                    // Next checkpoint
                    const next = (update.checkpointEtas || [])
                        .find(cp => !cp.passed);
                    if (next) {
                        const eta = next.etaTimestamp
                            ? new Date(next.etaTimestamp)
                                .toLocaleTimeString([], {
                                    hour:   '2-digit',
                                    minute: '2-digit'
                                })
                            : '—';
                        document.getElementById('statNext').textContent =
                            next.name + ' · ' + eta;
                    }

                    // Update runner on map
                    const latlng = [update.latitude, update.longitude];
                    if (runnerMarker) {
                        runnerMarker.setLatLng(latlng);
                    } else {
                        runnerMarker = L.marker(latlng, { icon: runnerIcon })
                            .addTo(map)
                            .bindPopup('<b>Runner</b>');
                    }

                    // Update elevation chart with runner position
                    renderElevationChart(runnerDistanceM);

                    // Update checkpoint list
                    if (update.checkpointEtas) {
                        renderCheckpointList(update.checkpointEtas, update);
                    }

                } catch (e) {
                    console.error('Poll error:', e);
                }
            }

            // ── Elevation chart ───────────────────────────────────────────
            function renderElevationChart(runnerDist) {
                if (!elevationData || elevationData.length === 0) return;

                const svg   = document.getElementById('elevationChart');
                const W     = 900;
                const H     = 160;
                const padL  = 50;
                const padR  = 20;
                const padT  = 20;
                const padB  = 28;

                const validPts = elevationData.filter(p => p[1] > 0);
                if (validPts.length === 0) return;

                const elevs    = validPts.map(p => p[1]);
                const minElev  = Math.min(...elevs);
                const maxElev  = Math.max(...elevs);
                const elevRange = maxElev - minElev || 1;
                const maxDist  = totalDistanceM || validPts[validPts.length-1][0];

                const scaleX = d => padL + (d / maxDist) * (W - padL - padR);
                const scaleY = e =>
                    padT + (1 - (e - minElev) / elevRange) * (H - padT - padB);

                const points = validPts
                    .map(p => `${scaleX(p[0])},${scaleY(p[1])}`).join(' ');

                const first  = validPts[0];
                const lastPt = validPts[validPts.length - 1];
                const polygon = `${scaleX(first[0])},${H - padB} `
                    + points + ` ${scaleX(lastPt[0])},${H - padB}`;

                // Checkpoint vertical lines
                const cpLines = sessionCheckpoints.map(cp => {
                    const x = scaleX(cp.distanceFromStartM);
                    return `<line x1="${x}" y1="${padT}"
                          x2="${x}" y2="${H - padB}"
                          stroke="#5fb458" stroke-width="1"
                          stroke-dasharray="3,3" opacity="0.6"/>`;
                }).join('');

                // Runner position line
                const rx = scaleX(runnerDist);
                const runnerLine = runnerDist > 0 ? `
            <line x1="${rx}" y1="${padT - 4}"
                  x2="${rx}" y2="${H - padB}"
                  stroke="#e74c3c" stroke-width="2.5"/>
            <circle cx="${rx}" cy="${padT + 4}"
                    r="5" fill="#e74c3c"/>
            <text x="${rx + 8}" y="${padT + 8}"
                  font-size="10" fill="#e74c3c"
                  font-weight="bold">▶ Runner</text>
        ` : '';

                // Y axis labels
                const yLabels = [minElev,
                    Math.round((minElev + maxElev) / 2),
                    maxElev]
                    .map(e => `<text x="${padL - 4}" y="${scaleY(e) + 4}"
                             font-size="10" fill="#888"
                             text-anchor="end">${Math.round(e)}m</text>`)
                    .join('');

                // X axis labels every 10km
                const xLabels = [];
                for (let km = 0; km <= Math.ceil(maxDist/1000); km += 10) {
                    xLabels.push(
                        `<text x="${scaleX(km*1000)}" y="${H - padB + 14}"
                       font-size="10" fill="#888"
                       text-anchor="middle">${km}km</text>`);
                }

                svg.innerHTML = `
            ${yLabels}
            ${xLabels.join('')}
            <line x1="${padL}" y1="${padT}"
                  x2="${padL}" y2="${H - padB}" stroke="#eee"/>
            <line x1="${padL}" y1="${H - padB}"
                  x2="${W - padR}" y2="${H - padB}" stroke="#eee"/>
            <polygon points="${polygon}"
                     fill="#5fb458" opacity="0.15"/>
            <polyline points="${points}"
                      fill="none" stroke="#5fb458" stroke-width="2"/>
            ${cpLines}
            ${runnerLine}`;
            }

            // ── Checkpoint list ───────────────────────────────────────────
            function renderCheckpointList(checkpoints, update) {
                const list = document.getElementById('checkpointList');

                if (!checkpoints || checkpoints.length === 0) {
                    list.innerHTML = `<div style="padding:24px; text-align:center;
                                          color:#aaa;">
                No checkpoints defined.</div>`;
                    return;
                }

                list.innerHTML = checkpoints.map((cp, idx) => {
                    const isPassed = cp.passed;
                    const isNext   = !isPassed
                        && (idx === 0 || checkpoints[idx - 1].passed);

                    let etaHtml = '';
                    if (isPassed) {
                        etaHtml = `<div style="color:#2ecc71; font-size:12px;
                                       font-weight:600;">✓ Passed</div>`;
                    } else if (cp.etaTimestamp) {
                        const eta   = new Date(cp.etaTimestamp);
                        const clock = eta.toLocaleTimeString([], {
                            hour: '2-digit', minute: '2-digit'
                        });
                        const inSecs = Math.max(0,
                            Math.round((cp.etaTimestamp - Date.now()) / 1000));
                        etaHtml = `
                    <div style="font-weight:700; color:#121F38;
                                font-size:15px;">${clock}</div>
                    <div style="font-size:11px; color:#888; margin-top:1px;">
                        in ${formatDuration(inSecs)}
                    </div>`;
                    } else {
                        etaHtml = `<div style="color:#ccc; font-size:12px;">—</div>`;
                    }

                    const bg = isNext
                        ? 'background:#fff8f0; border-left:3px solid #f39c12;'
                        : isPassed
                            ? 'background:#f8fff8; opacity:0.65;'
                            : '';

                    return `
                <div style="padding:12px 16px;
                            border-bottom:1px solid #f5f5f5;
                            display:flex; justify-content:space-between;
                            align-items:center; ${bg}">
                    <div style="flex:1; min-width:0;">
                        <div style="font-size:13px; font-weight:600;
                                    color:#121F38; white-space:nowrap;
                                    overflow:hidden; text-overflow:ellipsis;">
                            ${isNext ? '▶ ' : isPassed ? '✓ ' : ''}
                            ${escapeHtml(cp.name)}
                        </div>
                        <div style="font-size:11px; color:#aaa; margin-top:2px;">
                            ${(cp.distanceFromStartM / 1000).toFixed(1)} km
                            ${!isPassed && runnerDistanceM > 0
                                                ? ', ' + Math.max(0,
                                                ((cp.distanceFromStartM - runnerDistanceM) / 1000)
                                            ).toFixed(1) + ' km left'
                                                : ''}
                        </div>
                    </div>
                    <div style="text-align:right; margin-left:12px;
                                flex-shrink:0;">
                        ${etaHtml}
                    </div>
                </div>`;
                }).join('');
            }

            // ── Helpers ───────────────────────────────────────────────────
            function formatDuration(secs) {
                if (!secs || secs <= 0) return '0:00';
                const h = Math.floor(secs / 3600);
                const m = Math.floor((secs % 3600) / 60);
                const s = Math.floor(secs % 60);
                if (h > 0) return h + 'h' + String(m).padStart(2,'0') + 'm';
                return m + ':' + String(s).padStart(2,'0');
            }

            function timeSince(date) {
                const s = Math.floor((Date.now() - date.getTime()) / 1000);
                if (s < 60)   return s + 's ago';
                if (s < 3600) return Math.floor(s / 60) + 'm ago';
                return Math.floor(s / 3600) + 'h ' +
                    Math.floor((s % 3600) / 60) + 'm ago';
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            // ── Start ─────────────────────────────────────────────────────
            loadSession();

        })();
    </script>
</th:block>

</body>
</html>
