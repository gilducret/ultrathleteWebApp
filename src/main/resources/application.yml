spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  security:
    oauth2:
      client:
        registration:
          auth0:
            scope:
              - openid
              - profile
              - email

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080